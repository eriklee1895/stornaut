name: Stornaut CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stornaut-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Headless build and tests (macOS 26 arm64)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select the validated Xcode
        run: |
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Record toolchain
        run: |
          sw_vers
          test "$(uname -m)" = "arm64"
          uname -m
          xcodebuild -version
          swift --version

      - name: Run headless verification
        run: scripts/verify --headless

      - name: Publish verification timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-verification-timings
          path: .derivedData/verification/headless-timings.tsv
          if-no-files-found: warn
          include-hidden-files: true
